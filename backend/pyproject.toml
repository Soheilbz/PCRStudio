[project]
name = "pcrstudio-platform"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3", "djangorestframework>=3.16,<4",
  "django-allauth[headless,mfa]>=65.12,<66", "drf-spectacular>=0.28,<1",
  "cryptography>=50.0.2,<51", "psycopg[binary]>=3.2,<4", "redis>=6,<7", "gunicorn>=26.2,<27",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.12,<1", "mypy>=1.15,<2", "django-stubs[compatible-mypy]>=5.2,<5.3", "djangorestframework-stubs>=3.16,<4", "bandit[toml]>=1.8,<2", "pip-audit>=2.9,<3", "jsonschema>=4,<5"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
[tool.django-stubs]
django_settings_module = "config.settings"
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[[tool.uv.index]]
name = "verified-pypi-mirror"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
