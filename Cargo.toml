[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "17.0.0"
edition = "2021"
rust-version = "1.94"
license = "LicenseRef-PCRStudio-Proprietary"
authors = ["Soheil <soheil1751216@gmail.com>"]
repository = "https://github.com/Soheilbz/PCRStudio"

[workspace.dependencies]
pcr-application = { path = "crates/pcr-application" }
pcr-accounts = { path = "crates/pcr-accounts" }
pcr-contracts = { path = "crates/pcr-contracts" }
pcr-core = { path = "crates/pcr-core" }
pcr-projects = { path = "crates/pcr-projects" }
pcr-security = { path = "crates/pcr-security" }
pcr-storage = { path = "crates/pcr-storage" }
pcr-worker-client = { path = "crates/pcr-worker-client" }
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
rand = "0.10"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "tls-rustls-ring-native-roots"] }
uuid = { version = "1", features = ["v4"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "cors", "limit", "request-id", "set-header", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[workspace.lints.clippy]
all = "warn"
