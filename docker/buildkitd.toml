# PCRStudio's dedicated docker-container builder policy.
# The builder is isolated from the daemon's shared default builder and its
# BuildKit garbage collector keeps a bounded working set. Exact image digests,
# TLS and provenance are unaffected; only reconstructible build intermediates
# are eligible for collection.
[worker.oci]
  gc = true
  reservedSpace = "1GB"
  maxUsedSpace = "8GB"
  minFreeSpace = "20GB"

[worker.containerd]
  gc = true
  reservedSpace = "1GB"
  maxUsedSpace = "8GB"
  minFreeSpace = "20GB"
