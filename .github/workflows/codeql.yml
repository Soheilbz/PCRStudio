name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Initialize CodeQL
        uses: github/codeql-action/init@28deaeda66b76a05916b6923827895f2b14f4a4a
        with:
          languages: rust
          queries: security-extended
      - name: Build Rust workspace
        run: cargo build --locked --workspace
      - name: Analyze
        uses: github/codeql-action/analyze@28deaeda66b76a05916b6923827895f2b14f4a4a
