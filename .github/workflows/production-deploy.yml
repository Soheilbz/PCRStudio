name: Production deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact vMAJOR.MINOR.PATCH release tag to deploy
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pcrstudio-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the published release
    # Production never follows arbitrary branch pushes. A release publication
    # or an explicit dispatch of an exact stable SemVer tag is required. The
    # protected GitHub environment supplies the final human approval gate.
    if: github.event_name == 'workflow_dispatch' || (github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.source_ref }}
      PRODUCTION_DOMAIN: ${{ secrets.PCRSTUDIO_PRODUCTION_DOMAIN }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name || inputs.source_ref }}
          fetch-depth: 1

      - name: Materialize locked web verification dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0

      - name: Install uv for release verification
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.10"

      - name: Install locked web verification dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@11.26.0
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Install locked Python verification dependencies
        run: uv sync --project tools --frozen --extra dev --extra folding

      - name: Verify release identity and deployment inputs
        id: release
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          python3 -B scripts/validate-release-version.py --tag "$RELEASE_REF"
          [[ "$PRODUCTION_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PRODUCTION_DOMAIN" != .* && "$PRODUCTION_DOMAIN" != *..* ]]
          echo "release_sha=$(git rev-parse "$RELEASE_REF^{commit}")" >> "$GITHUB_OUTPUT"
          python3 -B scripts/generate-release-manifests.py --baseline-manifest release/baseline/R15-FILE-MANIFEST.json
          echo "build_id=$(sha256sum release/FILE-MANIFEST.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # The in-toto statement binds the generated manifests. Refresh it
          # between manifest passes, then refresh SHA256SUMS without creating
          # a hash cycle before independently verifying the release tree.
          python3 -B scripts/generate-source-attestation.py
          python3 -B scripts/generate-release-manifests.py --baseline-manifest release/baseline/R15-FILE-MANIFEST.json
          python3 -B scripts/qualify-source.py --no-write
          python3 -B scripts/verify-release.py --root .

      - name: Build the qualified runtime image set on GitHub's runner
        env:
          BUILD_ID: ${{ steps.release.outputs.build_id }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/next-server-actions-key"
          python3 -B -c 'import base64, secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())' > "$key_file"
          chmod 600 "$key_file"
          for target in api-runtime runner-runtime migrate-runtime; do
            docker buildx build --load --allow network.host --target "$target" \
              --build-arg PCRSTUDIO_BUILD_ID="$BUILD_ID" \
              --secret id=next_server_actions_key,src="$key_file" \
              -t "pcrstudio-${target%-runtime}:$RELEASE_SHA" -f docker/api.Dockerfile .
          done
          docker buildx build --load --allow network.host \
            --build-arg NEXT_PUBLIC_SITE_URL="https://$PRODUCTION_DOMAIN" \
            --secret id=next_server_actions_key,src="$key_file" \
            -t "pcrstudio-web:$RELEASE_SHA" -f docker/web.Dockerfile .

      - name: Publish the verified HTTPS deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/pcrstudio-release-assets"
          mkdir -p "$asset_dir"
          source_archive="$asset_dir/pcrstudio-source-$RELEASE_SHA.tar.gz"
          image_archive="$asset_dir/pcrstudio-images-$RELEASE_SHA.tar.gz"
          manifest="$asset_dir/pcrstudio-deploy-manifest-$RELEASE_SHA.json"
          git archive --format=tar --prefix="PCRStudio-$RELEASE_SHA/" "$RELEASE_REF" | gzip -n > "$source_archive"
          images=("pcrstudio-api:$RELEASE_SHA" "pcrstudio-runner:$RELEASE_SHA"
            "pcrstudio-migrate:$RELEASE_SHA" "pcrstudio-web:$RELEASE_SHA")
          docker image inspect "${images[@]}" > /dev/null
          docker save "${images[@]}" | gzip -n > "$image_archive"
          python3 -B - "$manifest" "$source_archive" "$image_archive" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          from scripts.release_bundle import docker_save_config_digests

          manifest_path, source_path, image_path = map(Path, sys.argv[1:])
          release_sha = os.environ["RELEASE_SHA"]
          release_ref = os.environ["RELEASE_REF"]
          image_names = ["pcrstudio-api", "pcrstudio-runner", "pcrstudio-migrate", "pcrstudio-web"]

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          image_config_digests = docker_save_config_digests(image_path)

          images = []
          for name in image_names:
              tag = f"{name}:{release_sha}"
              image_id = image_config_digests.get(tag)
              if image_id is None:
                  raise SystemExit(f"OCI image archive is missing {tag}")
              images.append({"name": name, "tag": release_sha, "image_id": image_id})
          manifest_path.write_text(json.dumps({
              "format_version": 1,
              "release_ref": release_ref,
              "source_sha": release_sha,
              "source_archive": {"name": source_path.name, "sha256": digest(source_path), "bytes": source_path.stat().st_size},
              "image_archive": {"name": image_path.name, "sha256": digest(image_path), "bytes": image_path.stat().st_size},
              "images": images,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          gh release upload "$RELEASE_REF" "$source_archive" "$image_archive" "$manifest" --repo "$GITHUB_REPOSITORY" --clobber
          echo "published HTTPS deployment assets for $RELEASE_REF ($RELEASE_SHA)"
