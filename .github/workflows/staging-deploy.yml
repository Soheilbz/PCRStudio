name: Staging deployment

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref containing the release candidate to stage
        required: true
        default: release-candidate-20260909
        type: string
      domain:
        description: DNS name configured for the staging host
        required: true
        type: string
      database_id:
        description: Approved scientific database identifier for the staging host
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pcrstudio-staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified source to staging
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify checked-out release contract
        run: |
          set -euo pipefail
          python3 -B scripts/qualify-source.py --no-write
          python3 -B scripts/verify-release.py --root .

      - name: Validate deployment inputs
        env:
          STAGING_DOMAIN: ${{ inputs.domain }}
          STAGING_DATABASE_ID: ${{ inputs.database_id }}
        run: |
          set -euo pipefail
          [[ "$STAGING_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$STAGING_DATABASE_ID" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$STAGING_DOMAIN" != .* && "$STAGING_DOMAIN" != *..* ]]
          [[ "$STAGING_DATABASE_ID" != .* && "$STAGING_DATABASE_ID" != *..* ]]

      - name: Prepare ephemeral SSH credentials
        env:
          PCRSTUDIO_STAGING_SSH_PRIVATE_KEY: ${{ secrets.PCRSTUDIO_STAGING_SSH_PRIVATE_KEY }}
          PCRSTUDIO_STAGING_SSH_KNOWN_HOSTS: ${{ secrets.PCRSTUDIO_STAGING_SSH_KNOWN_HOSTS }}
          PCRSTUDIO_STAGING_SSH_HOST: ${{ secrets.PCRSTUDIO_STAGING_SSH_HOST }}
        run: |
          set -euo pipefail
          test -n "$PCRSTUDIO_STAGING_SSH_PRIVATE_KEY"
          test -n "$PCRSTUDIO_STAGING_SSH_KNOWN_HOSTS"
          test -n "$PCRSTUDIO_STAGING_SSH_HOST"
          key_file="$RUNNER_TEMP/pcrstudio-staging-key"
          known_hosts_file="$RUNNER_TEMP/pcrstudio-staging-known-hosts"
          umask 077
          printf '%s\n' "$PCRSTUDIO_STAGING_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$PCRSTUDIO_STAGING_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          ssh-keygen -y -f "$key_file" > /dev/null
          ssh-keygen -F "$PCRSTUDIO_STAGING_SSH_HOST" -f "$known_hosts_file" > /dev/null

      - name: Transfer the exact committed source archive
        env:
          PCRSTUDIO_STAGING_SSH_PRIVATE_KEY: ${{ secrets.PCRSTUDIO_STAGING_SSH_PRIVATE_KEY }}
          PCRSTUDIO_STAGING_SSH_KNOWN_HOSTS: ${{ secrets.PCRSTUDIO_STAGING_SSH_KNOWN_HOSTS }}
          PCRSTUDIO_STAGING_SSH_HOST: ${{ secrets.PCRSTUDIO_STAGING_SSH_HOST }}
          PCRSTUDIO_STAGING_SSH_USER: ${{ secrets.PCRSTUDIO_STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$PCRSTUDIO_STAGING_SSH_USER"
          key_file="$RUNNER_TEMP/pcrstudio-staging-key"
          known_hosts_file="$RUNNER_TEMP/pcrstudio-staging-known-hosts"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file")
          release_dir="/srv/pcrstudio/releases/$GITHUB_SHA"
          ssh "${ssh_opts[@]}" "$PCRSTUDIO_STAGING_SSH_USER@$PCRSTUDIO_STAGING_SSH_HOST" \
            "umask 077; mkdir -p '$release_dir' /srv/pcrstudio/state/.local; ln -sfn /srv/pcrstudio/state/.local '$release_dir/.local'; ln -sfn /srv/pcrstudio/state/.env '$release_dir/.env'"
          git archive --format=tar "$GITHUB_SHA" | gzip -n | \
            ssh "${ssh_opts[@]}" "$PCRSTUDIO_STAGING_SSH_USER@$PCRSTUDIO_STAGING_SSH_HOST" \
            "tar -xzf - -C '$release_dir'"

      - name: Run the repository-supported staging bootstrap
        env:
          STAGING_DOMAIN: ${{ inputs.domain }}
          STAGING_DATABASE_ID: ${{ inputs.database_id }}
          PCRSTUDIO_STAGING_SSH_PRIVATE_KEY: ${{ secrets.PCRSTUDIO_STAGING_SSH_PRIVATE_KEY }}
          PCRSTUDIO_STAGING_SSH_KNOWN_HOSTS: ${{ secrets.PCRSTUDIO_STAGING_SSH_KNOWN_HOSTS }}
          PCRSTUDIO_STAGING_SSH_HOST: ${{ secrets.PCRSTUDIO_STAGING_SSH_HOST }}
          PCRSTUDIO_STAGING_SSH_USER: ${{ secrets.PCRSTUDIO_STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/pcrstudio-staging-key"
          known_hosts_file="$RUNNER_TEMP/pcrstudio-staging-known-hosts"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file")
          release_dir="/srv/pcrstudio/releases/$GITHUB_SHA"
          ssh "${ssh_opts[@]}" "$PCRSTUDIO_STAGING_SSH_USER@$PCRSTUDIO_STAGING_SSH_HOST" \
            "cd '$release_dir' && ./bootstrap.sh --domain '$STAGING_DOMAIN' --database-id '$STAGING_DATABASE_ID'"

      - name: Verify staging health through the deployment host
        env:
          PCRSTUDIO_STAGING_SSH_PRIVATE_KEY: ${{ secrets.PCRSTUDIO_STAGING_SSH_PRIVATE_KEY }}
          PCRSTUDIO_STAGING_SSH_KNOWN_HOSTS: ${{ secrets.PCRSTUDIO_STAGING_SSH_KNOWN_HOSTS }}
          PCRSTUDIO_STAGING_SSH_HOST: ${{ secrets.PCRSTUDIO_STAGING_SSH_HOST }}
          PCRSTUDIO_STAGING_SSH_USER: ${{ secrets.PCRSTUDIO_STAGING_SSH_USER }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/pcrstudio-staging-key"
          known_hosts_file="$RUNNER_TEMP/pcrstudio-staging-known-hosts"
          ssh_opts=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file")
          release_dir="/srv/pcrstudio/releases/$GITHUB_SHA"
          ssh "${ssh_opts[@]}" "$PCRSTUDIO_STAGING_SSH_USER@$PCRSTUDIO_STAGING_SSH_HOST" \
            "cd '$release_dir' && docker compose -f compose.yaml ps --status running && curl --fail --silent http://127.0.0.1:8080/health > /dev/null"
