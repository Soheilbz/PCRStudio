name: Linux source qualification

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pcrstudio-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.10"
      - name: Install locked web dependencies
        run: |
          corepack enable
          corepack install --global pnpm@11.26.0
          pnpm install --frozen-lockfile
      - name: Install locked Python dependencies
        run: uv sync --project tools --frozen --extra dev --extra folding
      - name: Run dependency-independent source qualification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/qualify-source.py --no-write
