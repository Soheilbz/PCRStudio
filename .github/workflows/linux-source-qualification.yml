name: Linux source qualification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - name: Install Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.8"
      - name: Install locked web dependencies
        run: |
          corepack enable
          corepack install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
      - name: Install locked Python dependencies
        run: uv sync --project tools --frozen --extra dev --extra folding
      - name: Run dependency-independent source qualification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/qualify-source.py --no-write
