version: 2

# Keep one bounded proposal per dependency boundary. The default branch is the
# only integration target; immutable production pins and lockfiles still pass
# the normal repository gates before they can be merged.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: UTC
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
    open-pull-requests-limit: 1
    rebase-strategy: auto
    labels: [dependencies]
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: npm
    # pnpm-lock.yaml and the workspace package.json are at the repository root.
    # Dependabot currently documents pnpm support only through v10, while this
    # repository pins pnpm 11. Keep the correct discovery path ready, but pause
    # version PRs (limit 0) until the updater can safely rewrite this lockfile.
    # Dependabot security updates remain enabled separately in repository settings.
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: UTC
    open-pull-requests-limit: 0
    rebase-strategy: auto
    labels: [dependencies]

  - package-ecosystem: uv
    directory: "/tools"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: UTC
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
    open-pull-requests-limit: 1
    rebase-strategy: auto
    labels: [dependencies]
    commit-message:
      prefix: "deps(python)"

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: UTC
    groups:
      rust-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
    open-pull-requests-limit: 1
    rebase-strategy: auto
    labels: [dependencies]
    commit-message:
      prefix: "deps(rust)"

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
      day: monday
      time: "05:00"
      timezone: UTC
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
    open-pull-requests-limit: 1
    rebase-strategy: auto
    labels: [dependencies]
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "05:15"
      timezone: UTC
    groups:
      compose-images-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
    open-pull-requests-limit: 1
    rebase-strategy: auto
    labels: [dependencies]
    commit-message:
      prefix: "deps(compose)"
