# Development tools and captured synthetic email. Never use this as a production release.
services:
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
    user: 10001:10001
    ports: [127.0.0.1:8025:8025]
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_ALLOWED_HOSTS: localhost,127.0.0.1,mailpit
      MP_QUIET: "true"
      MP_MAX_MESSAGES: "200"
      MP_SMTP_AUTH_ACCEPT_ANY: "false"
      MP_SMTP_AUTH_ALLOW_INSECURE: "false"
      MP_DISABLE_VERSION_CHECK: "true"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /data:uid=10001,gid=10001,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [mail, edge]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  tools:
    init: true
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: tools
      network: ${PCRSTUDIO_BUILD_NETWORK:-host}
      args:
        OFFICIAL_IMAGE_REGISTRY: ${PCRSTUDIO_OFFICIAL_IMAGE_REGISTRY:-public.ecr.aws/docker}
        LOCAL_UID: ${LOCAL_UID}
        LOCAL_GID: ${LOCAL_GID}
    image: ${COMPOSE_PROJECT_NAME}-tools:local
    user: ${LOCAL_UID}:${LOCAL_GID}
    environment:
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,caddy,testserver
      FRONTEND_URL: http://caddy:8080
      CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://caddy:8080
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: pcrstudio_testdb
      PGUSER: pcrstudio_test
      POSTGRES_PASSWORD_FILE: /run/secrets/db_test_password
      VALKEY_URL: redis://valkey:6379/1
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      DEFAULT_FROM_EMAIL: noreply@localhost
      PCRSTUDIO_BASE_URL: http://caddy:8080
      MAILPIT_URL: http://mailpit:8025
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_NO_SYNC: "1"
    secrets: [django_secret_key, mfa_encryption_key, db_test_password]
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/frontend/node_modules
    networks: [edge, data, cache, mail]
    dns: [1.1.1.1]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    tmpfs:
      - /tmp:size=1g,mode=1777
    profiles: [tools]
volumes:
  frontend_node_modules:
