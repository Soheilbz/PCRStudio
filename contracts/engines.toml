[[engine]]
id = "consensus-pair"
display_order = 8
label = "Consensus pair"
input = "an alignment"
command = "universal"
resource_weight = 4
[[engine.binding]]
tool_id = "mafft"
role = "PRIMARY"
purposes = ["alignment"]
operations = ["align_panel"]
artifact_identity = "inherit:toolchain-manifest.json"
[[engine.binding]]
tool_id = "primer3_core"
role = "PRIMARY"
purposes = ["candidate_generation"]
operations = ["evaluate_concrete_oligos", "design_pair_from_conserved_window"]
artifact_identity = "inherit:toolchain-manifest.json"
[[engine.binding]]
tool_id = "mfeprimer"
role = "VALIDATOR"
purposes = ["specificity"]
operations = ["validate_member_specificity"]
