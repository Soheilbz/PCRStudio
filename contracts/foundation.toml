http_body_bytes = 67108864
account_import_bytes = 67108864
project_settings_bytes = 10485760
project_notes_bytes = 262144
run_label_bytes = 1024
run_job_request_bytes = 8388608
run_job_aux_bytes = 262144
worker_stdout_bytes = 16777216
worker_stderr_bytes = 262144
# Must accommodate one maximum accepted job request plus one maximum worker
# result, including conservative JSON framing headroom.
run_document_bytes = 26214400
account_project_data_bytes = 58720256
account_job_data_bytes = 67108864
backup_document_bytes = 67108864
