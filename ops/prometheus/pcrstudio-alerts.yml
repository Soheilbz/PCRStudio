# @generated by scripts/generate-operations-policy.py from contracts/operations.toml; do not edit.
groups:
  - name: pcrstudio-current
    rules:
      - alert: PCRStudioNoFreshDurableRunner
        expr: pcrstudio_durable_runner_instances < 1
        for: 2m
        labels:
          severity: critical
          service: pcrstudio
        annotations:
          summary: "No fresh PCRStudio durable runner is registered"
          runbook: "docs/OPERATIONS.md#runner-unavailable"
      - alert: PCRStudioDurableQueueStalled
        expr: pcrstudio_durable_queued_jobs > 0 and pcrstudio_durable_oldest_queued_seconds > 120
        for: 5m
        labels:
          severity: critical
          service: pcrstudio
        annotations:
          summary: "PCRStudio durable jobs have been queued for more than two minutes"
          runbook: "docs/OPERATIONS.md#durable-queue-stalled"
      - alert: PCRStudioDurableQueuePressure
        expr: pcrstudio_durable_runner_capacity > 0 and pcrstudio_durable_queued_jobs > pcrstudio_durable_runner_capacity * 8
        for: 10m
        labels:
          severity: warning
          service: pcrstudio
        annotations:
          summary: "PCRStudio durable queue materially exceeds fresh runner capacity"
          runbook: "docs/OPERATIONS.md#durable-queue-pressure"
      - alert: PCRStudioDatabasePoolSaturation
        expr: pcrstudio_database_pool_size > 0 and (pcrstudio_database_pool_in_use / pcrstudio_database_pool_size) > 0.90
        for: 5m
        labels:
          severity: warning
          service: pcrstudio
        annotations:
          summary: "PCRStudio API database pool is more than 90 percent utilized"
          runbook: "docs/OPERATIONS.md#database-pool-saturation"
      - alert: PCRStudioAPIServerErrorBurst
        expr: increase(pcrstudio_http_server_errors_total[5m]) >= 5
        for: 2m
        labels:
          severity: warning
          service: pcrstudio
        annotations:
          summary: "PCRStudio API is returning repeated 5xx responses"
          runbook: "docs/OPERATIONS.md#api-server-errors"
      - alert: PCRStudioInteractiveWorkerFailures
        expr: increase(pcrstudio_worker_failed_jobs_total[10m]) >= 3
        for: 2m
        labels:
          severity: warning
          service: pcrstudio
        annotations:
          summary: "PCRStudio interactive scientific worker failures are repeating"
          runbook: "docs/OPERATIONS.md#interactive-worker-failures"
